name: Garmin sync

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6,18 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Restore Garmin health cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.garminconnect
            garmin_data.db
            garmin_files
          key: garmin-health-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            garmin-health-${{ github.repository_id }}-
      - name: Install Garmin health CLI
        run: python -m pip install garmin-health-data
      - name: Extract Garmin health database
        run: |
          START_DATE="${GARMIN_EXTRACT_START:-$(date -u -d '10 years ago' +%F)}"
          END_DATE="${GARMIN_EXTRACT_END:-$(date -u -d 'tomorrow' +%F)}"
          echo "Extracting Garmin health data from $START_DATE through $END_DATE (exclusive)."
          if ! find "$HOME/.garminconnect" -name garmin_tokens.json -print -quit | grep -q .; then
            garmin auth --email "$GARMIN_USERNAME" --password "$GARMIN_PASSWORD"
          fi
          garmin extract --start-date "$START_DATE" --end-date "$END_DATE"
          garmin verify
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_EXTRACT_START: ${{ vars.GARMIN_EXTRACT_START }}
          GARMIN_EXTRACT_END: ${{ vars.GARMIN_EXTRACT_END }}
      - run: npm ci
      - name: Audit Garmin database
        run: npm run garmin:audit
      - name: Import Garmin database into Lydiard
        run: npm run garmin:import-db
        env:
          LYDIARD_INGEST_KEY: ${{ secrets.LYDIARD_INGEST_KEY }}
          LYDIARD_BASE_URL: ${{ vars.LYDIARD_BASE_URL || 'https://lydiard.lydiard.workers.dev' }}
          GARMIN_IMPORT_ACTIVITY_TYPES: running
