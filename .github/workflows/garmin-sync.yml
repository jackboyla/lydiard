name: Garmin sync
run-name: Garmin sync · ${{ inputs.source || github.event_name }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source shown in the Actions run list
        required: false
        default: manual
  schedule:
    # Hourly at :17. The distinct 06:17 expression also runs the wider daily
    # reconciliation window without adding a second job in that hour.
    - cron: "17 0-5,7-23 * * *"
    - cron: "17 6 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: garmin-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # GitHub disables scheduled workflows after 60 days without repository
  # activity. Re-enabling an active workflow through the API resets that timer.
  keepalive:
    if: github.event.schedule == '17 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reset scheduled-workflow inactivity timers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in garmin-sync.yml fitbit-recovery-sync.yml d1-backup.yml; do
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable"
          done

  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Restore Garmin health cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.garminconnect
            garmin_data.db
            garmin_files
          key: garmin-health-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            garmin-health-${{ github.repository_id }}-
      - name: Install Garmin health CLI
        run: python -m pip install garmin-health-data==2.11.2
      - name: Extract Garmin health database
        run: |
          if [ "$GARMIN_SCHEDULE" = "17 6 * * *" ]; then
            DEFAULT_INCREMENTAL_DAYS=45
          else
            DEFAULT_INCREMENTAL_DAYS=7
          fi
          INCREMENTAL_DAYS="${GARMIN_INCREMENTAL_DAYS:-$DEFAULT_INCREMENTAL_DAYS}"
          START_DATE="${GARMIN_EXTRACT_START:-$(date -u -d "$INCREMENTAL_DAYS days ago" +%F)}"
          END_DATE="${GARMIN_EXTRACT_END:-$(date -u -d 'tomorrow' +%F)}"
          DATA_TYPES="${GARMIN_DATA_TYPES:-ACTIVITIES_LIST,ACTIVITY}"
          echo "Extracting Garmin health data from $START_DATE through $END_DATE (exclusive)."
          echo "Garmin incremental days: $INCREMENTAL_DAYS"
          echo "Garmin data types: $DATA_TYPES"
          echo "GARMIN_IMPORT_FROM=$START_DATE" >> "$GITHUB_ENV"
          echo "GARMIN_IMPORT_TO=$END_DATE" >> "$GITHUB_ENV"

          run_garmin_with_retry() {
            local label="$1"
            shift
            local log_file status wait_seconds
            log_file="$(mktemp)"
            for attempt in 1 2 3; do
              echo "Garmin $label attempt $attempt/3"
              set +e
              "$@" 2>&1 | tee "$log_file"
              status="${PIPESTATUS[0]}"
              if [ "$status" -eq 0 ]; then
                rm -f "$log_file"
                return 0
              fi
              if grep -Eiq '429|too many requests|rate.?limit|temporarily unavailable|timed? ?out|connection reset|502|503|504' "$log_file"; then
                if [ "$attempt" -lt 3 ]; then
                  wait_seconds=$((60 * attempt))
                  echo "Garmin $label hit a transient upstream error; retrying in ${wait_seconds}s."
                  sleep "$wait_seconds"
                  continue
                fi
                echo "::error::Garmin $label failed with a transient upstream error after 3 attempts."
                rm -f "$log_file"
                return "$status"
              fi
              rm -f "$log_file"
              return "$status"
            done
          }

          if ! find "$HOME/.garminconnect" -name garmin_tokens.json -print -quit | grep -q .; then
            if [ -z "$GARMIN_USERNAME" ] || [ -z "$GARMIN_PASSWORD" ]; then
              echo "::error::GARMIN_USERNAME and GARMIN_PASSWORD secrets are required when no cached Garmin tokens are available."
              exit 1
            fi
            run_garmin_with_retry "auth" garmin auth --email "$GARMIN_USERNAME" --password "$GARMIN_PASSWORD"
          fi
          IFS=',' read -ra TYPE_LIST <<< "$DATA_TYPES"
          DATA_TYPE_ARGS=()
          for TYPE_NAME in "${TYPE_LIST[@]}"; do
            TYPE_NAME="$(echo "$TYPE_NAME" | xargs)"
            if [ -n "$TYPE_NAME" ]; then
              DATA_TYPE_ARGS+=(--data-types "$TYPE_NAME")
            fi
          done
          run_garmin_with_retry "extract" garmin extract --start-date "$START_DATE" --end-date "$END_DATE" "${DATA_TYPE_ARGS[@]}"
          garmin verify
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_INCREMENTAL_DAYS: ${{ vars.GARMIN_INCREMENTAL_DAYS }}
          GARMIN_EXTRACT_START: ${{ vars.GARMIN_EXTRACT_START }}
          GARMIN_EXTRACT_END: ${{ vars.GARMIN_EXTRACT_END }}
          GARMIN_DATA_TYPES: ${{ vars.GARMIN_DATA_TYPES }}
          GARMIN_SCHEDULE: ${{ github.event.schedule }}
          GARMIN_NO_VERSION_CHECK: "1"
      - run: npm ci
      - name: Audit Garmin database
        run: npm run garmin:audit
      - name: Import Garmin runs into Lydiard
        run: npm run garmin:import-db -- --no-replace --allow-empty
        env:
          LYDIARD_INGEST_KEY: ${{ secrets.LYDIARD_INGEST_KEY }}
          LYDIARD_BASE_URL: ${{ vars.LYDIARD_BASE_URL }}
          GARMIN_IMPORT_ACTIVITY_TYPES: running
      - name: Import Garmin gym sessions into Lydiard
        run: npm run garmin:import-gym -- --no-replace --allow-empty
        env:
          LYDIARD_INGEST_KEY: ${{ secrets.LYDIARD_INGEST_KEY }}
          LYDIARD_BASE_URL: ${{ vars.LYDIARD_BASE_URL }}
      - name: Save Garmin health cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.garminconnect
            garmin_data.db
            garmin_files
          key: garmin-health-${{ github.repository_id }}-${{ github.run_id }}
      - name: Remove superseded Garmin caches
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CACHE_KEY: garmin-health-${{ github.repository_id }}-${{ github.run_id }}
          GARMIN_CACHE_PREFIX: garmin-health-${{ github.repository_id }}-
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            | jq -r --arg prefix "$GARMIN_CACHE_PREFIX" --arg current "$CURRENT_CACHE_KEY" \
                '.actions_caches[] | select(.key | startswith($prefix)) | select(.key != $current) | .id' \
            | while read -r cache_id; do
                [ -n "$cache_id" ] && gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$cache_id"
              done
