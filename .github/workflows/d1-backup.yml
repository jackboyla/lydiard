name: Encrypted D1 backup
run-name: Encrypted D1 backup · ${{ inputs.source || github.event_name }}

# Exports the full production D1 database, restores it into temporary SQLite,
# checks integrity and row floors, encrypts it with the configured public key,
# then uploads a dated copy to the app-owned private Drive folder.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN              Account / D1 Read only
#   LYDIARD_BACKUP_PUBLIC_KEY         armored OpenPGP public key (see config.example/README.md)
#   GOOGLE_DRIVE_BACKUP_CLIENT_ID
#   GOOGLE_DRIVE_BACKUP_CLIENT_SECRET
#   GOOGLE_DRIVE_BACKUP_REFRESH_TOKEN drive.file scope only
# Required repository variables:
#   CLOUDFLARE_ACCOUNT_ID
#   GOOGLE_DRIVE_BACKUP_FOLDER_ID

on:
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source shown in the Actions run list
        required: false
        default: manual
      force_monthly:
        description: Also write a monthly copy
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "43 2 * * *"

permissions:
  contents: read

concurrency:
  group: encrypted-d1-backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DRIVE_BACKUP_CONFIGURED: ${{ secrets.GOOGLE_DRIVE_BACKUP_CLIENT_ID != '' && secrets.GOOGLE_DRIVE_BACKUP_CLIENT_SECRET != '' && secrets.GOOGLE_DRIVE_BACKUP_REFRESH_TOKEN != '' && vars.GOOGLE_DRIVE_BACKUP_FOLDER_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Export, restore-check, and encrypt D1
        run: npm run backup:d1 -- --output-dir "$RUNNER_TEMP/lydiard-backup" --result-file "$RUNNER_TEMP/backup-result.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          LYDIARD_BACKUP_PUBLIC_KEY: ${{ secrets.LYDIARD_BACKUP_PUBLIC_KEY }}
          NODE_OPTIONS: --max-old-space-size=2048
      - name: Save encrypted recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: lydiard-d1-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/lydiard-backup/*.sql.gz.gpg
            ${{ runner.temp }}/lydiard-backup/*.manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload and verify private Drive copy
        if: env.DRIVE_BACKUP_CONFIGURED == 'true'
        env:
          GOOGLE_DRIVE_BACKUP_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_BACKUP_CLIENT_ID }}
          GOOGLE_DRIVE_BACKUP_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_BACKUP_CLIENT_SECRET }}
          GOOGLE_DRIVE_BACKUP_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_BACKUP_REFRESH_TOKEN }}
          GOOGLE_DRIVE_BACKUP_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_BACKUP_FOLDER_ID }}
          FORCE_MONTHLY: ${{ inputs.force_monthly || 'false' }}
        run: |
          archive="$(jq -r '.archivePath' "$RUNNER_TEMP/backup-result.json")"
          manifest="$(jq -r '.manifestPath' "$RUNNER_TEMP/backup-result.json")"
          args=()
          if [ "$FORCE_MONTHLY" = "true" ]; then
            args+=(--force-monthly)
          fi
          npm run backup:drive:upload -- --archive "$archive" --manifest "$manifest" "${args[@]}"
      - name: Report pending Drive setup
        if: env.DRIVE_BACKUP_CONFIGURED != 'true'
        run: echo "::notice::Google Drive is not configured; the encrypted 14-day Actions artifact is the recovery copy for this run."
